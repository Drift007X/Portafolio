  <script>
    // Espera a las fuentes (máx. 1,2 s) antes de mostrar la entrada animada
    (function (d) {
      var h = d.documentElement; h.classList.add('fl');
      var done = function () { h.classList.remove('fl'); };
      setTimeout(done, 1200);
      if (d.fonts && d.fonts.load) Promise.all([
        d.fonts.load('800 italic 1em "Barlow Condensed"'),
        d.fonts.load('500 1em "Barlow"')
      ]).then(done, done);
    })(document);
  </script>
  <link rel="preconnect" href="https://cdn.modrinth.com">
  <link rel="preconnect" href="https://media.forgecdn.net">

<body>
  <a class="skip" href="#contenido">Saltar al contenido</a>
  <header class="topbar" data-topbar>
    <div class="wrap nav">
      <a class="brand" href="index.html" aria-label="Ir al inicio">
        <span class="brand-mark"><img class="brand-img" src="assets/img/perfil-sm.webp" alt="" width="40" height="40"></span>
        <span class="dsp brand-name" data-nombre>Drift007_</span>
        <span class="crumb dsp" aria-hidden="true"><span class="crumb-sep">/</span>Portafolio</span>

      <button class="menu-btn" aria-expanded="false" aria-controls="menu" aria-label="Abrir menú">

      </nav>
    </div>
    <div class="topbar-line" aria-hidden="true"></div>
  </header>

  <main class="page pf" id="contenido">
    <div class="work-stripes" aria-hidden="true"><span></span><span></span></div>
    <div class="wrap">
      <div class="pf-head">
        <div class="work-head">
          <span class="mono e1"><span class="dot">◆</span> Mis trabajos</span>
          <h1 class="dsp page-title e2">Portafolio</h1>
        </div>
        <div class="pf-stats e3" aria-label="Resumen">
          <div><span class="dsp pf-num" data-pf-total>0</span><span class="mono">Trabajos</span></div>
          <div><span class="dsp pf-num" data-pf-cats>4</span><span class="mono">Categorías</span></div>
        </div>
      </div>

      <div class="pf-cats e3" role="tablist" aria-label="Categorías" data-pf-cats-list></div>

      <div class="pf-bar e4">
        <span class="mono">Mostrando <strong data-pf-showing>Todo</strong> · <span data-pf-count>0</span></span>
        <button type="button" class="pf-reset mono" data-pf-reset hidden>Ver todo ×</button>
      </div>

      <div class="pf-years e4" role="group" aria-label="Filtrar por año" data-pf-years hidden></div>

      <div class="pf-groups e4" data-pf-grid></div>

      <div class="pf-empty" data-pf-empty hidden>
        <span class="mono"><span class="dot">◆</span> En preparación</span>
        <span class="dsp" data-pf-empty-title>Próximamente</span>
        <p>Estoy preparando trabajos para esta categoría. Volvé pronto.</p>
      </div>
    </div>
  </main>

  <dialog class="lb" data-lb aria-label="Trabajo">
    <div class="lb-inner">
      <div class="lb-media"><img data-lb-img alt=""><canvas class="lb-canvas" data-lb-canvas hidden></canvas>
        <div class="lb-skin-ui" data-lb-skin-ui hidden>
          <span class="mono lb-hint">Arrastrá para girar · Rueda para acercar</span>
          <div class="lb-anim" role="group" aria-label="Animación">
            <button type="button" class="lb-chip" data-anim="idle" aria-pressed="true"><span>Quieto</span></button>
            <button type="button" class="lb-chip" data-anim="walk" aria-pressed="false"><span>Caminar</span></button>
            <button type="button" class="lb-chip" data-anim="run" aria-pressed="false"><span>Correr</span></button>
            <button type="button" class="lb-chip" data-spin aria-pressed="true"><span>Girar</span></button>
          </div>
        </div>
      </div>
      <div class="lb-info">
        <div class="lb-head">
          <img class="lb-logo" data-lb-logo alt="" hidden>
          <div>
            <span class="mono lb-cat" data-lb-cat></span>
            <h2 class="dsp lb-title" data-lb-title></h2>
          </div>
        </div>
        <p class="lb-desc" data-lb-desc></p>
        <div class="lb-meta" data-lb-meta hidden></div>
        <div class="lb-actions" data-lb-actions></div>
        <div class="lb-nav">
          <button type="button" class="lb-btn" data-lb-prev aria-label="Anterior"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
          <span class="mono" data-lb-pos></span>
          <button type="button" class="lb-btn" data-lb-next aria-label="Siguiente"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        </div>
      </div>
      <button type="button" class="lb-close" data-lb-close aria-label="Cerrar"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </dialog>

  <footer class="footer">
    <div class="wrap footer-row">
      <span class="diamond" aria-hidden="true"></span>
      <button class="mono copy" type="button" data-discord><span class="copy-in">Discord: <strong data-discord-user>Drift007_</strong> <span class="copy-hint">Copiar</span></span></button>
      <span class="mono stamp" data-trayectoria>Desde 2022 — 2026</span>
    </div>
  </footer>

  <script src="data/skins.js"></script>
  <script src="data/traducciones.js"></script>
  <script src="js/i18n.js"></script>
  <script src="data/site.js"></script>
  <script src="js/main.js"></script>

</html>
